services:
  cache_context.styling_profiles:
    class: Drupal\styling_profiles\CacheContext\StylingProfiles
    arguments: ['@styling_profile.service.rule_handler_manager']
    tags:
      - { name: cache.context }
  styling_profile.service.sass_manager:
    class: Drupal\styling_profiles\Service\SassManager
    arguments: ['@iq_barrio_helper.iq_barrio_service', '%app.root%']
  styling_profile.service.rule_handler_manager:
    class: Drupal\styling_profiles\Service\RuleHandlerManager
    parent: default_plugin_manager
  styling_profiles.asset.resolver.decorator:
    public: false
    class: Drupal\styling_profiles\Asset\AssetResolverDecorator
    decorates: asset.resolver
    decoration_inner_name: 'original_asset_resolver'
    decoration_priority: 5
    arguments:
      - '@original_asset_resolver'
      - '@styling_profile.service.rule_handler_manager'
      - '@asset.css.collection_optimizer'
      - '@current_route_match'
      - '@router.admin_context'
      - '@library.discovery'
      - '@library.dependency_resolver'
      - '@module_handler'
      - '@theme.manager'
      - '@language_manager'
      - '@cache.asset_chain'
      - '@theme_handler'
